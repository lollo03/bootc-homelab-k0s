name: Build image

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run hadolint
        uses: essentialkaos/hadolint-action@v1
        with:
          files: Containerfile

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: |
          K0S_VERSION=$(sed -ne 's|ARG K0S_VERSION\=\(.*\)|\1|p' Containerfile | tr + -)
          K8S_VERSION=$(echo $K0S_VERSION | cut -d "-" -f 1)
          K8S_VERSION_MINOR=$(echo $K8S_VERSION | cut -d "." -f 1-2)

          echo "K0S_VERSION=$K0S_VERSION" >> $GITHUB_ENV
          echo "K8S_VERSION=$K8S_VERSION" >> $GITHUB_ENV
          echo "K8S_VERSION_MINOR=$K8S_VERSION_MINOR" >> $GITHUB_ENV
          echo "IMAGE_TAG=k0s-bootc" >> $GITHUB_ENV

      - name: Set up Buildah
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_TAG }}
          containerfiles: |
            Containerfile
          build-args: |
            SSH_AUTHORIZED_KEYS=${{ secrets.SSH_AUTHORIZED_KEYS }}
          extra-args: |
            --no-hosts
            --no-hostname
            --format=docker
            --isolation=chroot

      - name: Install container-structure-test
        run: |
          sudo curl -sSL -o /usr/local/bin/container-structure-test \
            https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64
          sudo chmod +x /usr/local/bin/container-structure-test

      - name: Load image into Docker for testing
        run: |
          buildah push ${{ env.IMAGE_TAG }} docker-daemon:${{ env.IMAGE_TAG }}:latest

      - name: Run container structure tests
        run: |
          container-structure-test test \
            --image ${{ env.IMAGE_TAG }}:latest \
            --config tests/structure-test.yaml

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image with tags
        if: github.event_name != 'pull_request'
        run: |
          REGISTRY_IMAGE="ghcr.io/${{ github.repository_owner }}/${IMAGE_TAG}"

          buildah push $IMAGE_TAG "${REGISTRY_IMAGE}:latest"
          buildah push $IMAGE_TAG "${REGISTRY_IMAGE}:${K8S_VERSION}"
          buildah push $IMAGE_TAG "${REGISTRY_IMAGE}:${K8S_VERSION_MINOR}"
          buildah push $IMAGE_TAG "${REGISTRY_IMAGE}:${K0S_VERSION}"
          buildah push $IMAGE_TAG "${REGISTRY_IMAGE}:${K0S_VERSION}-${GITHUB_SHA::7}"
        env:
          GITHUB_REGISTRY: ghcr.io
      
